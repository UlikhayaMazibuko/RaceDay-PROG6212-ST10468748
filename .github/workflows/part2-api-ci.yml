
name: Part 2 API build and tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Part2

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore Part2.slnx

      - name: Build the API and test project
        run: dotnet build Part2.slnx --configuration Release --no-restore

      - name: Run the unit tests
        run: dotnet test Part2.slnx --configuration Release --no-build --verbosity normal