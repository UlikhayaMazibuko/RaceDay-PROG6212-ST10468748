# This workflow runs on every push. It builds the API and runs the unit tests,
# then builds the MVC website and its Docker image
name: RaceDay build, tests and Docker

on:
  push:
  pull_request:

jobs:
  api-build-and-test:
    name: Part 2 API build and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part2

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore Part2.slnx

      - name: Build the API and test project
        run: dotnet build Part2.slnx --configuration Release --no-restore

      - name: Run the unit tests
        run: dotnet test Part2.slnx --configuration Release --no-build --verbosity normal

  mvc-build-and-docker:
    name: Part 3 MVC build and Docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Part3

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore Part3.slnx

      - name: Build the MVC web app
        run: dotnet build Part3.slnx --configuration Release --no-restore

      - name: Build the Docker image
        run: docker build -t raceday-web ./RaceDay.Web
